<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8fafc"><title>每日打卡</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#17212f;margin:0}main{max-width:520px;margin:auto;padding:22px 16px 60px}h1{font-size:25px;margin:0 0 5px}.muted{color:#697586;font-size:13px}.card{background:white;border:1px solid #e6eaf0;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 3px 15px #17212f08}.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}button{cursor:pointer;font:inherit}.nav{border:1px solid #e1e6ec;background:white;border-radius:10px;padding:7px 13px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekday{text-align:center;color:#8792a1;font-size:12px;padding:8px 0}.day{border:1px solid transparent;background:white;border-radius:11px;min-height:49px;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:7px}.day.selected{border-color:#208b69;background:#edf8f3}.dots{display:flex;gap:3px}.dot{width:5px;height:5px;border-radius:50%;background:#e0e5eb}.dot.on{background:#208b69}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.slot{background:white;border:1px solid #dce3ea;border-radius:12px;padding:17px 3px;font-size:17px}.slot.on{background:#e7f7ef;border-color:#208b69;color:#137a54}.summary{display:flex;gap:12px}.stat{flex:1;text-align:center;padding:14px 4px;background:#f7fafc;border-radius:12px}.num{font-size:27px;font-weight:700}.details{font-size:13px;line-height:2;color:#566274}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1;padding:10px;background:#f7fafc;border:1px solid #dce3ea;border-radius:10px}.note{line-height:1.6}</style></head><body><main><h1>每日打卡</h1><div class="muted">早 · 中 · 晚 · 夜，自由记录</div><section class="card"><div class="toolbar"><button class="nav" id="prev" aria-label="上个月">‹</button><strong id="month"></strong><button class="nav" id="next" aria-label="下个月">›</button></div><div class="calendar" id="cal"></div></section><section class="card"><div class="toolbar"><strong id="date"></strong><button class="nav" id="today">今天</button></div><div class="slots" id="slots"></div></section><section class="card"><strong>打卡统计</strong><div class="summary" style="margin-top:14px"><div class="stat"><div class="muted">本周</div><div class="num" id="week">0</div><div class="muted">次</div></div><div class="stat"><div class="muted">当前日历月</div><div class="num" id="monthly">0</div><div class="muted">次</div></div></div><div class="details" id="details"></div></section><section class="card"><strong>数据备份</strong><p class="muted note">记录自动保存在当前浏览器。换手机、清除浏览器数据可能导致记录丢失。建议定期导出备份；此版本尚不支持云同步。</p><div class="actions"><button id="export">导出备份</button><button id="import">导入备份</button></div><input type="file" id="file" accept="application/json" hidden></section></main><script>
const KEY='daily-checkin-v1';let records={};try{const p=JSON.parse(localStorage.getItem(KEY)||'{}');if(p&&typeof p==='object'&&!Array.isArray(p))records=p}catch{};const names=['早','中','晚','夜'];const now=new Date();let selected=new Date(now.getFullYear(),now.getMonth(),now.getDate()),view=new Date(now.getFullYear(),now.getMonth(),1);const pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,dayArr=k=>Array.isArray(records[k])?Array.from({length:4},(_,i)=>records[k][i]===true):[false,false,false,false];function save(){localStorage.setItem(KEY,JSON.stringify(records))}function render(){document.getElementById('month').textContent=`${view.getFullYear()}年${view.getMonth()+1}月`;document.getElementById('date').textContent=`${selected.getMonth()+1}月${selected.getDate()}日`;const cal=document.getElementById('cal');cal.innerHTML='';['一','二','三','四','五','六','日'].forEach(s=>{const e=document.createElement('div');e.className='weekday';e.textContent=s;cal.append(e)});const offset=(new Date(view.getFullYear(),view.getMonth(),1).getDay()+6)%7;for(let i=0;i<offset;i++)cal.append(document.createElement('div'));const count=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();for(let i=1;i<=count;i++){const d=new Date(view.getFullYear(),view.getMonth(),i),k=key(d),b=document.createElement('button');b.className='day'+(k===key(selected)?' selected':'');b.setAttribute('aria-label',`${i}日`);const n=document.createElement('span');n.textContent=i;const dots=document.createElement('span');dots.className='dots';dayArr(k).forEach(v=>{const dot=document.createElement('span');dot.className='dot'+(v?' on':'');dots.append(dot)});b.append(n,dots);b.onclick=()=>{selected=d;render()};cal.append(b)}const slots=document.getElementById('slots');slots.innerHTML='';dayArr(key(selected)).forEach((on,i)=>{const b=document.createElement('button');b.className='slot'+(on?' on':'');b.textContent=on?'✓ '+names[i]:names[i];b.setAttribute('aria-pressed',String(on));b.onclick=()=>{const a=dayArr(key(selected));a[i]=!a[i];records[key(selected)]=a;save();render()};slots.append(b)});const weekday=(now.getDay()+6)%7,start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-weekday),end=new Date(start.getFullYear(),start.getMonth(),start.getDate()+6);let week=0,month=0,breakdown=[0,0,0,0];for(const [k] of Object.entries(records)){if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;const a=dayArr(k),sum=a.filter(Boolean).length;if(k>=key(start)&&k<=key(end))week+=sum;if(k.slice(0,7)===key(view).slice(0,7)){month+=sum;a.forEach((v,i)=>{if(v)breakdown[i]++})}}document.getElementById('week').textContent=week;document.getElementById('monthly').textContent=month;document.getElementById('details').textContent=`当前月：${names.map((n,i)=>`${n} ${breakdown[i]}次`).join(' · ')}；本周为周一至周日`}
document.getElementById('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};document.getElementById('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};document.getElementById('today').onclick=()=>{selected=new Date(now.getFullYear(),now.getMonth(),now.getDate());view=new Date(now.getFullYear(),now.getMonth(),1);render()};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`daily-checkin-${key(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(obj.version!==1||!obj.records||typeof obj.records!=='object'||Array.isArray(obj.records))throw Error('格式不正确');if(!confirm('导入将替换当前设备全部打卡记录，继续吗？'))return;const clean={};for(const [k,v] of Object.entries(obj.records)){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&Array.isArray(v)&&v.length===4&&v.every(x=>typeof x==='boolean'))clean[k]=v}records=clean;save();render();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}};render();
</script></body></html>
